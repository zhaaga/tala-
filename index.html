<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tala · Tala 的简历</title>
<meta name="description" content="">
<meta name="theme-color" content="#1C2342">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C2342'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23D6F04F'/%3E%3C/svg%3E">
<!--
  ======================================================================
  3D 场景个人网站 · 单文件模板
  - 所有内容都在下面 id="site-content" 的脚本块里（window.SITE = {...}）
  - 换房间：改 SITE.scene（studio / kitchen / bar / cabinet / cafe / custom）
  - 换底座：改 SITE.base（island / grass / cloud / water / rock / pedestal / none）
  - 模块：改 SITE.modules（about / journey / works / products / articles /
          hobbies / travel / contact / chat / custom）
  - 不会写代码？双击打开本文件 → 左上角黄色按钮「导入我的内容」→ 粘贴 AI 给你的
    内容 → 预览 → 点格子放照片 → 「下载成品网页」
  ======================================================================
-->
<style>
:root{
  --sky:#CBD7EA; --paper:#FFFDF9; --ink:#1C2342; --muted:#636C8C; --line:#E4E1DA;
  --accent:#E2434F; --lime:#D6F04F; --pearl:#F4EEE6;
  --f-display:"Gloock","Noto Serif SC",Georgia,serif;
  --f-cn-display:"Noto Serif SC","Songti SC","STSong",Georgia,serif;
  --f-body:"Instrument Sans","Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-hand:"Caveat","ZCOOL KuaiLe","Kaiti SC","KaiTi",cursive;
  --f-hand-cn:"ZCOOL KuaiLe","Caveat","Kaiti SC","KaiTi",cursive;
  --ui-fg:var(--ink); --ui-glass:rgba(255,253,249,.72);
  color-scheme:light;
}
body.night{--sky:#151B36;--ui-fg:#F3F1EC;--ui-glass:rgba(28,35,66,.62)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font:14px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;transition:background .8s}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:8px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
body.hovering #gl{cursor:pointer}
body.dragging #gl{cursor:grabbing}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#fff 0,#F6F0E8 45%,#EDE9F1 100%);transition:opacity .8s,visibility .8s}
#loader.done{opacity:0;visibility:hidden}
#loader .lbrand{position:absolute;top:28px;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:26px}
#loader .lbrand span{font-family:var(--f-hand);color:var(--accent);font-size:20px;margin-left:6px;display:inline-block;transform:rotate(-6deg)}
#loader .ring{position:relative;width:220px;height:220px}
#loader .ring i{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;opacity:0;transform:scale(.3);transition:opacity .35s,transform .45s cubic-bezier(.3,1.6,.5,1);box-shadow:inset -3px -4px 6px rgba(0,0,0,.12),inset 3px 3px 5px rgba(255,255,255,.7)}
#loader .ring i.on{opacity:1;transform:scale(1)}
#loader .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:46px}
#loader .pct small{font-size:18px;color:var(--accent);margin-left:2px}
#loader .ltxt{margin-top:22px;text-align:center;font-size:17px}
#loader .lsub{color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;position:absolute;bottom:26px;left:0;right:0;text-align:center}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));color:var(--ui-fg);pointer-events:none}
.topbar>*{pointer-events:auto}
.logo{display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:0;white-space:nowrap}
.logo b{font-family:var(--f-display);font-weight:400;font-size:28px;letter-spacing:.02em;line-height:1}
.logo span{font-family:var(--f-hand);font-size:20px;color:var(--accent);transform:rotate(-6deg);display:inline-block}
.nav{margin:0 auto;display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--ui-glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 24px rgba(28,35,66,.08);max-width:calc(100vw - 360px);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;display:flex;gap:6px;align-items:baseline;white-space:nowrap;transition:background .2s,color .2s}
.nav button small{font-size:11px;opacity:.55;letter-spacing:.04em;text-transform:uppercase}
.nav button:hover{background:rgba(214,240,79,.55);color:var(--ink)}
.nav button.on{background:var(--ink);color:#fff}
body.night .nav button.on{background:var(--lime);color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center}
.daynight{width:40px;height:40px;border-radius:50%;border:0;background:var(--ui-glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;font-size:18px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.daynight:hover{transform:rotate(25deg) scale(1.08)}

/* ---------- hero ---------- */
.hero{position:fixed;z-index:9;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));max-width:min(470px,calc(100vw - 48px));color:var(--ui-fg);transition:opacity .5s,transform .6s cubic-bezier(.2,.9,.3,1)}
.hero.away{opacity:0;transform:translateY(20px);pointer-events:none}
.hero .hi{font-family:var(--f-hand-cn);font-size:20px;color:var(--accent);display:inline-block;transform:rotate(-2deg);margin-bottom:8px}
body.night .hero .hi{color:var(--lime)}
.hero h1{font-family:var(--f-cn-display);font-weight:900;font-size:clamp(30px,3.5vw,50px);line-height:1.12;margin:0 0 14px;letter-spacing:-.01em;text-wrap:balance}
.hero h1 mark{background:linear-gradient(transparent 58%,var(--lime) 58%,var(--lime) 92%,transparent 92%);color:inherit;padding:0 2px}
body.night .hero h1 mark{color:var(--lime);background:none}
.hero p{margin:0 0 18px;font-size:15px;line-height:1.7;opacity:.85}
.hero .btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14px;display:inline-flex;gap:8px;align-items:center;text-decoration:none;transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .3s}
.btn:hover{transform:translateY(-2px) rotate(-1deg)}
.btn.main{background:var(--accent);color:#fff;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.ghost{background:var(--ui-glass);backdrop-filter:blur(10px)}
.hint{position:fixed;z-index:10;right:max(22px,env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));font-family:var(--f-hand-cn);font-size:16px;color:var(--ui-fg);opacity:.7;transition:opacity .4s}
.hint.away{opacity:0}
.chatfab{position:fixed;z-index:11;right:max(22px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));border:0;border-radius:999px;background:var(--lime);color:var(--ink);font-weight:700;padding:12px 18px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 26px rgba(28,35,66,.18);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.chatfab:hover{transform:translateY(-2px) scale(1.04)}
.chatfab i{width:8px;height:8px;border-radius:50%;background:#2BB673;box-shadow:0 0 0 4px rgba(43,182,115,.2)}

/* ---------- world labels (bubbles) ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:8}
#labels.away .tag{opacity:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);transform-origin:0 0;pointer-events:auto;border:0;padding:7px 14px;border-radius:999px;background:rgba(255,253,249,.94);color:var(--ink);font-size:14px;font-weight:600;letter-spacing:.04em;white-space:nowrap;display:flex;align-items:center;box-shadow:0 3px 10px rgba(28,35,66,.13);transition:background .2s,color .2s,opacity .35s,scale .25s cubic-bezier(.3,1.6,.5,1),box-shadow .2s;will-change:translate}
.tag::before{content:"";position:absolute;inset:-12px -10px -10px}
.tag::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:1px;z-index:-1}
.tag .txt{display:flex;align-items:baseline;gap:6px}
.tag small{font-family:var(--f-hand);font-size:15px;font-weight:700;color:#ffe2e4;max-width:0;overflow:hidden;opacity:0;transition:max-width .35s,opacity .25s}
.tag:hover,.tag:focus-visible,.tag.on{background:var(--accent);color:#fff;z-index:4;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent)}
.tag:hover,.tag:focus-visible{scale:1.12}
.tag:hover small,.tag:focus-visible small,.tag.on small{max-width:140px;opacity:1}
.bubble{position:fixed;z-index:9;left:0;top:0;pointer-events:none;font-family:var(--f-hand-cn);font-size:16px;background:var(--ink);color:#fff;padding:6px 12px;border-radius:14px;max-width:240px;text-align:center;box-shadow:0 6px 18px rgba(28,35,66,.15);transform:translate(-50%,-100%);opacity:0;transition:opacity .25s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.bubble.show{opacity:1}
.toast{position:fixed;z-index:60;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;max-width:calc(100vw - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 2D fallback when WebGL / three.js is unavailable ---------- */
#flat{position:fixed;inset:0;z-index:5;display:none;place-items:center;padding:100px 24px 160px}
body.flat #flat{display:grid}
html:has(body.flat){overflow:auto}
body.flat{display:flex;flex-direction:column;overflow:auto}
body.flat .hero{position:static;margin:110px auto 0;width:min(820px,calc(100% - 48px));max-width:none}
body.flat #flat{position:static;order:1;padding:30px 24px 150px}
body.flat #gl,body.flat #labels{display:none}
.flatgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;width:min(820px,100%)}
.flatgrid button{border:0;border-radius:22px;padding:26px 16px;background:var(--paper);box-shadow:0 10px 30px rgba(28,35,66,.1);display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:16px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.flatgrid button:hover{transform:translateY(-4px) rotate(-1deg)}
.flatgrid button span{font-size:34px}
.flatgrid button small{font-family:var(--f-hand);color:var(--accent);font-size:16px;font-weight:700}

/* ---------- panel ---------- */
#panel{position:fixed;z-index:15;left:50%;top:calc(84px + env(safe-area-inset-top,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:min(1080px,calc(100vw - 48px));translate:-50% 0;background:var(--paper);color:var(--ink);border-radius:28px;box-shadow:0 30px 80px rgba(28,35,66,.25);opacity:0;transform:translateY(30px) scale(.97) rotate(.6deg);transition:opacity .45s,transform .6s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;overflow:hidden}
#panel.open{opacity:1;transform:none}
#panel:not(.open),#panel:not(.open) *{pointer-events:none!important}
#panel .close{position:absolute;top:18px;right:20px;z-index:5;border:0;background:var(--ink);color:#fff;height:38px;padding:0 14px 0 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;gap:8px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
#panel .close:hover{transform:rotate(-4deg) scale(1.05)}
#panel .close b{font-size:16px;font-weight:400}
.pbody{overflow-y:auto;overscroll-behavior:contain;padding:46px clamp(20px,8vw,100px) 60px;flex:1;background-image:radial-gradient(rgba(28,35,66,.07) 1px,transparent 1.2px);background-size:18px 18px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);display:flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--accent)}
.ptitle{font-family:var(--f-cn-display);font-weight:900;font-size:clamp(30px,3.4vw,44px);line-height:1.12;margin:14px 0 10px;letter-spacing:-.01em;text-wrap:balance}
.ptitle .en{display:block;font-family:var(--f-display);font-weight:400;font-size:.66em;color:var(--accent);margin-top:6px}
.lede{font-size:15.5px;line-height:1.8;color:#3b4262;max-width:62ch;margin:0 0 26px}
.h3{font-family:var(--f-hand-cn);font-size:22px;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.h3::after{content:"";flex:1;height:1px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips i{font-style:normal;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
.demo-tag{display:inline-flex;gap:6px;background:var(--lime);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:999px;transform:rotate(-1.5deg);margin-left:10px;vertical-align:middle}
@keyframes hbin{from{opacity:0;transform:translateY(18px) scale(.97)}}

/* bento cards shared */
.hb{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.hb>section{position:relative;grid-column:span 3;border-radius:22px;padding:20px;background:var(--hbg,#fff);border:1.5px solid rgba(28,35,66,.08);min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:10px;animation:hbin .55s cubic-bezier(.2,.9,.3,1) backwards}
.hb>section.wide{grid-column:1/-1}
.hb>section.w2{grid-column:span 4}
.hb>section.w1{grid-column:span 2}
.hb>section.dark{background:var(--ink);color:#F6F3EC;border-color:transparent}
.hb>section:nth-child(2){animation-delay:.06s}.hb>section:nth-child(3){animation-delay:.12s}.hb>section:nth-child(4){animation-delay:.18s}.hb>section:nth-child(5){animation-delay:.24s}.hb>section:nth-child(n+6){animation-delay:.3s}
.hbh{display:flex;align-items:center;gap:10px}
.hbh .ic{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.75);display:grid;place-items:center;flex:none}
.hb>section.dark .hbh .ic{background:rgba(255,255,255,.1)}
.hbh .ic svg{width:19px;height:19px}
.hbh h4{margin:0;font-family:var(--f-cn-display);font-size:19px;font-weight:900}
.hbh h4 small{font-family:var(--f-hand);color:var(--accent);font-size:19px;font-weight:700;margin-left:6px}
.hb p{margin:0;font-size:13.5px;line-height:1.7;opacity:.85}
.hb .go{margin-top:auto;align-self:flex-start;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700}
.hb>section.dark .go{background:var(--lime);color:var(--ink)}

/* about */
.ab{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;align-items:start}
.abph{position:relative;height:400px;border-radius:26px;background:radial-gradient(circle at 50% 40%,#fff,var(--pearl));display:grid;place-items:end center;overflow:visible}
.abph img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(28,35,66,.18))}
.abph .mono{width:190px;height:190px;border-radius:50%;align-self:center;display:grid;place-items:center;font-family:var(--f-display);font-size:96px;color:#fff;background:var(--accent);box-shadow:0 18px 40px rgba(28,35,66,.18)}
.st{position:absolute;padding:10px 14px;border-radius:16px;font-weight:800;line-height:1.1;text-align:center;rotate:var(--r);animation:pop .6s cubic-bezier(.3,1.6,.5,1) backwards;box-shadow:0 8px 20px rgba(28,35,66,.12)}
.st b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px}
.st small{font-size:11px;letter-spacing:.06em;opacity:.8}
.st.s1{left:-18px;top:80px;--r:-10deg;background:var(--paper);color:var(--accent);border:2px solid var(--accent);animation-delay:.3s}
.st.s2{right:-18px;top:120px;--r:9deg;background:var(--ink);color:#fff;animation-delay:.45s}
.st.s3{left:-10px;bottom:40px;--r:7deg;background:var(--accent);color:#fff;animation-delay:.6s}
.st.s4{right:-12px;bottom:70px;--r:-6deg;background:#fff;color:var(--ink);border:2px dashed var(--ink);animation-delay:.75s}
@keyframes pop{from{opacity:0;scale:.4}}
.prof{width:100%;border-collapse:collapse;margin:6px 0 18px;font-size:14px}
.prof td{padding:9px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.prof td:first-child{width:72px;color:var(--muted);font-size:12px;letter-spacing:.08em}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.badges span{font-family:var(--f-hand-cn);font-size:15px;padding:4px 12px;border-radius:999px;background:var(--lime);transform:rotate(var(--r,-1deg))}
.badges span:nth-child(2n){background:#F9C6CC;--r:1.5deg}
.badges span:nth-child(3n){background:#AFC3E6;--r:-2deg}
.letter{max-width:640px;margin:0 auto;background:#fff;border-radius:6px;padding:46px 48px;box-shadow:0 18px 50px rgba(28,35,66,.12);background-image:repeating-linear-gradient(transparent 0 33px,#EEE9E0 33px 34px);line-height:34px;font-size:16px;rotate:-.6deg}
.letter p{margin:0 0 34px}
.letter .hand{font-family:var(--f-hand-cn);font-size:21px}
.letter .sign{text-align:right;font-family:var(--f-hand);font-size:26px;color:var(--accent)}

/* journey: book */
.book{display:grid;grid-template-columns:200px 1fr;gap:26px;align-items:start}
.toc{display:flex;flex-direction:column;gap:6px;position:sticky;top:0}
.toc .tt{font-family:var(--f-hand);font-size:22px;color:var(--accent)}
.toc button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:12px;display:flex;gap:8px;align-items:baseline;font-size:13.5px;transition:background .2s}
.toc button em{font-style:normal;font-family:var(--f-display);color:var(--muted);font-size:13px}
.toc button.on{background:var(--ink);color:#fff}
.toc button.on em{color:var(--lime)}
.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:430px;border-radius:10px 22px 22px 10px;background:#fff;box-shadow:0 22px 50px rgba(28,35,66,.14),inset 0 0 0 1px var(--line);perspective:1600px}
.spread::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:40px;translate:-50% 0;background:linear-gradient(90deg,transparent,rgba(28,35,66,.08),transparent);pointer-events:none;z-index:2}
.pg{padding:34px 34px 30px;min-width:0;display:flex;flex-direction:column;gap:12px}
.pg.l{background:var(--pgc,#F4EEE6);border-radius:10px 0 0 10px}
.pg .no{font-family:var(--f-display);font-size:15px;color:var(--muted)}
.pg .big{font-family:var(--f-cn-display);font-weight:900;font-size:clamp(26px,2.6vw,38px);line-height:1.08;white-space:pre-line}
.pg .yr{font-family:var(--f-hand);font-size:22px;color:var(--accent)}
.pg .pic{margin-top:auto;width:100%;max-width:300px;align-self:center}
.pg h4{margin:0;font-family:var(--f-cn-display);font-size:22px;font-weight:900}
.pg ul{margin:4px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.7}
.pg .notes{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.pg .notes span{font-family:var(--f-hand-cn);font-size:14px;padding:4px 10px;background:var(--lime);rotate:-2deg;box-shadow:0 3px 8px rgba(28,35,66,.1)}
.pg .notes span:nth-child(2){background:#F9C6CC;rotate:2deg}
.flip{position:absolute;right:0;top:0;bottom:0;width:50%;background:#fff;transform-origin:left center;border-radius:0 22px 22px 0;z-index:3;animation:flip .55s cubic-bezier(.4,.1,.3,1) forwards;box-shadow:-8px 0 20px rgba(28,35,66,.1)}
.flip.back{left:0;right:auto;transform-origin:right center;border-radius:10px 0 0 10px;animation-name:flipb}
@keyframes flip{to{transform:rotateY(-180deg);opacity:.2}}
@keyframes flipb{to{transform:rotateY(180deg);opacity:.2}}
.bnav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}

const head = (m, lede) => `<div class="eyebrow">${esc(m.label)} · ${esc(m.en)}</div><h2 class="ptitle">${esc(m.title || m.label)}${SITE.demo === true ? '<span class="demo-tag">✎ 示例内容</span>' : SITE.demo === "preview" ? '<span class="demo-tag">✎ 预览中</span>' : ""}${m.subtitle ? `<span class="en">${esc(m.subtitle)}</span>` : ""}</h2>${(lede || m.lede) ? `<p class="lede">${esc(lede || m.lede)}</p>` : ""}`;
const mdInline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>");
function mdBlocks(paras) {
  return (paras || []).map(p => { p = String(p);
    if (/^##\s/.test(p)) return `<h2>${mdInline(p.replace(/^##\s*/, ""))}</h2>`;
    const lines = p.split("\n");
    if (lines.every(l => /^\s*(\d+\.|-)\s/.test(l))) { const ol = /^\s*\d/.test(lines[0]); return `<${ol ? "ol" : "ul"}>${lines.map(l => `<li>${mdInline(l.replace(/^\s*(\d+\.|-)\s*/, ""))}</li>`).join("")}</${ol ? "ol" : "ul"}>`; }
    return `<p>${lines.map(mdInline).join("<br>")}</p>`; }).join("");
}

const LOADER = (() => { const ring = $("#ring"), N = 24, cols = ["#FFFDF9", "#F9C6CC", "#E2434F", "#D6F04F", "#AFC3E6", "#F4EEE6"]; const beads = [];
  for (let i = 0; i < N; i++) { const b = document.createElement("i"), a = i / N * Math.PI * 2 - Math.PI / 2; b.style.left = 50 + Math.cos(a) * 42 + "%"; b.style.top = 50 + Math.sin(a) * 42 + "%"; b.style.background = cols[i % cols.length]; ring.appendChild(b); beads.push(b); }
  let p = 0, target = .12; const iv = setInterval(() => { p += (target - p) * .15; $("#pct").textContent = Math.round(p * 100); beads.forEach((b, i) => b.classList.toggle("on", i / N < p)); }, 60);

  const used = new Set(), items = {};
  const placeable = MODS.filter(m => m.object !== false && !(m.type === "chat" && m.object == null));
  placeable.filter(m => typeof m.object === "string").forEach(m => { const s = slots.find(x => x.key === m.object && !used.has(x.key)); if (s) { used.add(s.key); items[m.id] = { m, s }; } });
  placeable.filter(m => !items[m.id]).forEach(m => { const s = slots.find(x => !used.has(x.key) && x.suggest.includes(m.type)); if (s) { used.add(s.key); items[m.id] = { m, s }; } });
  placeable.filter(m => !items[m.id]).forEach(m => { const s = slots.find(x => !used.has(x.key)); if (s) { used.add(s.key); items[m.id] = { m, s }; } });
  const HOME = { t: new T.Vector3(.3, 1.3, .3), r: phone ? 48 : 35, th: .78, ph: .6 };
  const hits = [], hitMat = new T.MeshBasicMaterial({ visible: false });
  Object.values(items).forEach(it => { const bb = new T.Box3().setFromObject(it.s.obj), c = bb.getCenter(new T.Vector3()), sz = bb.getSize(new T.Vector3());
    it.anchor = new T.Vector3(c.x, bb.max.y + .35, c.z); it.base = it.s.obj.position.clone(); it.h = 0;
    const hb = new T.Mesh(new T.BoxGeometry(sz.x + .4, sz.y + .4, sz.z + .4), hitMat); hb.position.copy(c); hb.userData.id = it.m.id; scene.add(hb); hits.push(hb);
    const th = c.x < -4.6 ? 1.2 : c.z < -4.2 ? .42 : .78; it.view = { t: c.clone(), r: Math.min(15, Math.max(8, Math.max(sz.x, sz.y, sz.z) * 2.2 + 6)) * (phone ? 1.35 : 1), th, ph: .32 };
    const b = document.createElement("button"); b.type = "button"; b.className = "tag"; b.innerHTML = `<span class="txt">${esc(it.m.label)}<small>${esc(it.m.en)}</small></span>`; b.setAttribute("aria-label", it.m.label);
    b.addEventListener("click", () => goTo(it.m.id)); b.addEventListener("mouseenter", () => { hoverTag = it.m.id; }); b.addEventListener("mouseleave", () => { hoverTag = null; });
    $("#labels").appendChild(b); it.tag = b; });
  const avHit = new T.Mesh(new T.BoxGeometry(1.2, 2.8, 1.2), hitMat); avHit.position.set(AVP[0], 1.4, AVP[2]); avHit.userData.id = "__me"; scene.add(avHit); hits.push(avHit);

  // camera rig
  const cam = { t: HOME.t.clone(), r: HOME.r + 8, th: HOME.th - .5, ph: HOME.ph + .1 }; let goal = Object.assign({}, HOME, { t: HOME.t.clone() });
  let userTh = 0, userPh = 0, userR = 0, mx = 0, my = 0, hoverId = null, hoverTag = null, focusId = null;
  const ray = new T.Raycaster(), ptr = new T.Vector2();
  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 42 : 30; camera.updateProjectionMatrix(); HOME.r = (w < h ? 48 : 35) * Math.max(1, 1.25 - w / 4000); if (!focusId) goal.r = HOME.r; }
  addEventListener("resize", resize); resize();
  // pointer
  let down = null;
  canvas.addEventListener("pointermove", e => { mx = e.clientX / innerWidth * 2 - 1; my = e.clientY / innerHeight * 2 - 1;
    if (down) { const dx = e.clientX - down.x, dy = e.clientY - down.y; if (Math.hypot(dx, dy) > 6) down.drag = true; if (down.drag) { document.body.classList.add("dragging"); userTh = Math.max(-.6, Math.min(.6, down.th - dx * .005)); userPh = Math.max(-.2, Math.min(.3, down.ph + dy * .003)); } return; }
    ptr.set(mx, -my); ray.setFromCamera(ptr, camera); const h = ray.intersectObjects(hits)[0]; hoverId = h ? h.object.userData.id : null; document.body.classList.toggle("hovering", !!hoverId); });
  canvas.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY, th: userTh, ph: userPh }; });
  addEventListener("pointerup", e => { const wasDrag = down && down.drag; down = null; document.body.classList.remove("dragging"); if (wasDrag || e.target !== canvas) return;
    ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight * 2 - 1)); ray.setFromCamera(ptr, camera); const h = ray.intersectObjects(hits)[0];
    if (h) { if (h.object.userData.id === "__me") say(pick((SITE.avatar && SITE.avatar.lines) || ["你好呀～"])); else goTo(h.object.userData.id); } });
  canvas.addEventListener("wheel", e => { if (focusId) return; userR = Math.max(-8, Math.min(10, userR + e.deltaY * .01)); }, { passive: true });
  // avatar speech bubble
  const bub = $("#mebub"); let bubT = 0;
  function say(t, ms = 3200) { bub.textContent = t; bub.classList.add("show"); bubT = performance.now() + ms; }
  // night mode
  let night = !!P.night, nk = night ? 1 : 0;
  function setNight(on) { night = on; state.windows.forEach(w => { w.m.map = on ? w.night : w.day; w.m.needsUpdate = true; }); }
  if (night) { document.body.classList.add("night"); $("#daynight").textContent = "☀"; setNight(true); }

  SCENE_API = {
    focus(id) { const it = items[id]; focusId = id; if (!it) { goal = Object.assign({}, HOME, { t: HOME.t.clone(), r: HOME.r + 3 }); return 250; } goal = { t: it.view.t.clone(), r: it.view.r, th: it.view.th, ph: it.view.ph }; userTh = userPh = userR = 0; Object.values(items).forEach(x => x.tag.classList.toggle("on", x.m.id === id)); return reduced ? 0 : 650; },
    home() { focusId = null; goal = Object.assign({}, HOME, { t: HOME.t.clone() }); Object.values(items).forEach(x => x.tag.classList.remove("on")); },
    night: setNight
  };
  setNight(night);

  // loop
  const clock = new T.Clock(); let frame = 0, blinkAt = 2;
  const tagPos = [];
  function loop() { requestAnimationFrame(loop); if (document.hidden) return; const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime; frame++;
    if (openId && frame % 3) return;  // 面板打开时降帧省电
    const k = 1 - Math.exp(-dt * 3.2), par = (hoverTag || down || focusId) ? 0 : .4;
    cam.t.lerp(goal.t, k); cam.r += (goal.r + (focusId ? 0 : userR) - cam.r) * k;
    cam.th += (goal.th + (focusId ? 0 : userTh) + mx * .12 * par - cam.th) * k; cam.ph += (goal.ph + (focusId ? 0 : userPh) - my * .06 * par - cam.ph) * k;
    camera.position.set(cam.t.x + cam.r * Math.cos(cam.ph) * Math.sin(cam.th), cam.t.y + cam.r * Math.sin(cam.ph), cam.t.z + cam.r * Math.cos(cam.ph) * Math.cos(cam.th)); camera.lookAt(cam.t);
    // night lerp
    nk += ((night ? 1 : 0) - nk) * k; hemi.intensity = .5 - nk * .3; sun.intensity = .62 - nk * .5; lamps.forEach(l => l.intensity = nk * 1.6);
    state.bulbs.forEach((m, i) => m.color.setHSL(.12, .9, .82 + nk * .1 * Math.sin(t * 2 + i)));
    S.lampBulbs.forEach(b => b.material.color.set(nk > .5 ? "#FFE29A" : "#FFF6E0"));
    // hover lift
    Object.values(items).forEach(it => { const on = hoverId === it.m.id || hoverTag === it.m.id || focusId === it.m.id; it.h += ((on ? 1 : 0) - it.h) * Math.min(1, dt * 10); it.s.obj.position.y = it.base.y + it.h * .14; });
    S.spin.forEach(o => o.rotation.y += dt * .6);
    steam.forEach(s => { const q = (t * .35 + s.userData.k) % 1, p = s.userData.p; s.position.set(p[0] + Math.sin(q * 6 + s.userData.k * 9) * .12, p[1] + q * 1.4, p[2]); s.material.opacity = .5 * Math.sin(q * Math.PI); s.scale.setScalar(.3 + q * .5); });
    dust.rotation.y = t * .01; state.anim.forEach(f => f(t));
    // avatar idle
    const u = av.userData; u.body.position.y = Math.sin(t * 2.2) * .03; u.arms.forEach((a, i) => a.rotation.x = Math.sin(t * 2.2 + i * Math.PI) * .08);
    let face = HOME.th; if (focusId && items[focusId]) { const c = items[focusId].view.t; face = Math.atan2(c.x - AVP[0], c.z - AVP[2]); } else face = Math.atan2(camera.position.x - AVP[0], camera.position.z - AVP[2]);
    let dA = face - av.rotation.y; dA = Math.atan2(Math.sin(dA), Math.cos(dA)); av.rotation.y += dA * Math.min(1, dt * 4);
    if (t > blinkAt) { u.eyes.forEach(e => e.scale.y = .15); if (t > blinkAt + .12) { u.eyes.forEach(e => e.scale.y = 1.25); blinkAt = t + 2 + Math.random() * 3; } }
    renderer.render(scene, camera);
    // tags (screen space, keep away from nav, push apart when overlapping)
    const W = innerWidth, H = innerHeight, top = isPhone() ? 70 : 96, bottom = isPhone() ? H - 80 : H - 20; tagPos.length = 0;
    Object.values(items).forEach(it => { const v = it.anchor.clone(); v.y += it.h * .14; v.project(camera); const vis = v.z < 1; let x = (v.x * .5 + .5) * W, y = (-v.y * .5 + .5) * H; x = Math.max(70, Math.min(W - 70, x)); y = Math.max(top, Math.min(bottom, y)); tagPos.push({ it, x, y, vis }); });
    for (let pass = 0; pass < 3; pass++) for (let i = 0; i < tagPos.length; i++) for (let j = i + 1; j < tagPos.length; j++) { const a = tagPos[i], b = tagPos[j]; const gap = W < 760 ? 58 : 76; if (Math.abs(a.y - b.y) < 36 && Math.abs(a.x - b.x) < gap) { const push = (gap - Math.abs(a.x - b.x)) / 2 + .5, s = a.x <= b.x ? -1 : 1; a.x += s * push; b.x -= s * push; } }
    tagPos.forEach(p => { p.it.tag.style.translate = `${p.x}px ${p.y}px`; p.it.tag.style.opacity = p.vis ? "" : "0"; p.it.tag.classList.toggle("on", hoverId === p.it.m.id || focusId === p.it.m.id); });
    // bubble above avatar head
    if (bub.classList.contains("show")) { const v = new T.Vector3(av.position.x, 3.0, av.position.z).project(camera); bub.style.left = (v.x * .5 + .5) * W + "px"; bub.style.top = (-v.y * .5 + .5) * H + "px"; if (performance.now() > bubT || openId) bub.classList.remove("show"); }
  }
  LOADER.to(.95); loop();
  setTimeout(() => { LOADER.done(); setTimeout(() => say(((SITE.avatar && SITE.avatar.lines) || ["欢迎～"])[0]), 1200); }, 300);
  return true;
}

/* =====================================================================
   8. 启动
   ===================================================================== */
(async () => {
  let ok = false; try { ok = await boot3D(); } catch (e) { console.error(e); ok = false; }
  if (!ok) { document.body.classList.add("flat"); $("#hint").textContent = "点一点上面的卡片"; LOADER.done(); }
  if (/[?&]open=([\w-]+)/.test(location.search)) goTo(RegExp.$1);
})();

</script>
